<main class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-indigo-500 to-purple-600">
  <mat-card class="w-full max-w-md shadow-2xl overflow-hidden">

    <mat-card-header class="mb-6">
      <div class="w-full">
        <mat-card-title class="text-2xl font-bold text-gray-800">{{ appName }}</mat-card-title>
      </div>
    </mat-card-header>

    <mat-card-content class="p-6 bg-white">

      <div *ngIf="success" class="flex items-center gap-3 p-4 mb-6 bg-green-50 border border-green-200 rounded-lg">
        <mat-icon class="text-green-600">check_circle</mat-icon>
        <p class="text-green-800 font-medium m-0">¡Registro exitoso! Redirigiendo...</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success" class="flex flex-col gap-5">

        <mat-form-field appearance="outline" class="w-full custom-field">
          <mat-label>Usuario</mat-label>
          <input matInput type="text" formControlName="username" autocomplete="username" required
            class="!border-none" />
          <mat-error *ngIf="form.controls.username.invalid">
            Usuario requerido (mín. 3 carácteres)
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full custom-field">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            autocomplete="new-password" required class="!border-r-0" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
            class="text-gray-500 border-l border-gray-200 rounded-none h-full w-12">
            <mat-icon>{{ hidePassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.invalid">Min. 6 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full custom-field">
          <mat-label>Confirmar Contraseña</mat-label>
          <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword"
            autocomplete="new-password" required />
          <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword"
            class="text-gray-500 border-l border-gray-200 rounded-none h-full w-12">
            <mat-icon>{{ hideConfirmPassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.confirmPassword.invalid">Las contraseñas no coinciden</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" class="w-full !h-12 !text-lg !rounded-lg mt-2 shadow-md" type="submit"
          [disabled]="loading">
          <mat-progress-spinner *ngIf="loading" diameter="20" mode="indeterminate"
            class="inline-block mr-2"></mat-progress-spinner>
          <span>{{ loading ? "Procesando..." : "Registrarse" }}</span>
        </button>

      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">
          ¿Ya tienes cuenta? <a routerLink="/login" class="text-indigo-600 font-bold hover:underline">Inicia
            sesión aquí</a>
        </p>
      </div>

    </mat-card-content>
  </mat-card>
</main>

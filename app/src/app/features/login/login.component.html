<main class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-indigo-500 to-purple-600">
  <mat-card class="w-full max-w-md shadow-2xl overflow-hidden">
    <mat-card-header class="mb-6">
      <div class="w-full">
        <mat-card-title class="text-2xl font-bold text-gray-800">{{ appName }}</mat-card-title>
      </div>
    </mat-card-header>

    <mat-card-content class="p-6 bg-white">
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Usuari</mat-label>
          <input matInput type="text" formControlName="username" autocomplete="username" required />
          <mat-error *ngIf="form.controls.username.touched && form.controls.username.invalid">
            L'usuari és obligatori
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Contrasenya</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            autocomplete="current-password" required />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar contrasenya' : 'Ocultar contrasenya'">
            <mat-icon>{{ hidePassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">
            La contrasenya és obligatòria
          </mat-error>
        </mat-form-field>

        <div *ngIf="error" class="p-3 rounded bg-red-50 border-l-4 border-red-500 animate-fade-in">
          <p class="text-sm text-red-800 m-0 font-medium">{{ error }}</p>
        </div>

        <button mat-raised-button color="primary" class="w-full !h-12 !text-lg !rounded-lg mt-2 shadow-md transition-all" 
          type="submit" [disabled]="loading">
          <div class="flex items-center justify-center gap-2">
            <mat-progress-spinner *ngIf="loading" diameter="20" mode="indeterminate"></mat-progress-spinner>
            <span>{{ loading ? "Iniciant sessió..." : "Iniciar Sessió" }}</span>
          </div>
        </button>

        <p class="text-center mt-4 text-sm text-gray-600">
          No tens compte? <a routerLink="/register"
            class="text-blue-600 font-semibold hover:underline ml-1 transition-colors">Registra't aquí</a>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</main>

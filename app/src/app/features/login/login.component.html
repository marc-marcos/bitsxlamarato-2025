<main class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>{{ appName }}</mat-card-title>
      <mat-card-subtitle>Acceso Profesional</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error *ngIf="form.controls.email.touched && form.controls.email.invalid">
            Introduce un email válido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <mat-icon>{{ hidePassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">
            La contraseña es obligatoria
          </mat-error>
        </mat-form-field>

        <mat-slide-toggle formControlName="demoMode">Modo Demo</mat-slide-toggle>

        <p class="error" *ngIf="error">{{ error }}</p>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loading">
          <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate"></mat-progress-spinner>
          <span>{{ loading ? "Entrando…" : "Iniciar Sesión" }}</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>

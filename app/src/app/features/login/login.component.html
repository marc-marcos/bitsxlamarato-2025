<main class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-indigo-500 to-purple-600">
  <mat-card class="w-full max-w-md shadow-2xl">
    <mat-card-header class="mb-6">
      <mat-card-title class="text-2xl font-bold">{{ appName }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Usuario</mat-label>
          <input matInput type="text" formControlName="username" autocomplete="username" required />
          <mat-error *ngIf="form.controls.username.touched && form.controls.username.invalid">
            El usuario es obligatorio
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            autocomplete="current-password" required />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
            <mat-icon>{{ hidePassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">
            La contraseña es obligatoria
          </mat-error>
        </mat-form-field>

        <div *ngIf="error" class="p-3 rounded bg-red-50 border-l-4 border-red-500">
          <p class="text-sm text-red-800 m-0">{{ error }}</p>
        </div>

        <button mat-raised-button color="primary" class="w-full h-12 mt-2" type="submit" [disabled]="loading">
          <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate"
            class="inline-block align-middle mr-2"></mat-progress-spinner>
          <span>{{ loading ? "Entrando…" : "Iniciar Sesión" }}</span>
        </button>

        <p class="text-center mt-5 text-sm text-gray-600">
          ¿No tienes cuenta? <a routerLink="/register"
            class="text-blue-600 font-semibold hover:underline ml-1">Regístrate aquí</a>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</main>
